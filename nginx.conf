server {
    listen       80;
    server_name  localhost;

    # Behind a TLS proxy nginx only sees http, so absolute redirects
    # (e.g. /all/post -> /all/post/) would downgrade to http:// and
    # break Astro's fetch-based view transitions as mixed content.
    absolute_redirect off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
